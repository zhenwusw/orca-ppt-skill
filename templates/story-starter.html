<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>{{TITLE}}</title>
  <!-- {{ROOT}} = 从这份 HTML 到 skill 根目录的相对路径，比如 ../.. -->
  <link rel="stylesheet" href="{{ROOT}}/node_modules/reveal.js/dist/reset.css">
  <link rel="stylesheet" href="{{ROOT}}/node_modules/reveal.js/dist/reveal.css">
  <link rel="stylesheet" href="{{ROOT}}/runtime/tokens.css">
</head>
<body>
<div class="reveal">

<!-- 转场计划（故事线：{{一句话论点}}）
1→2  关系：…   手法：推近匹配 / 遮挡变形   锚点：… → …
-->

<div class="slides">

  <!-- 每页一张照片：width / height 写原图尺寸，data-anchors 用原图像素，data-guide 写本页引导框所在的锚点 -->
  <section data-guide="{{锚点A}}" data-hold="2">
    <img class="st-photo" src="photos/photo-01.png" width="1536" height="1024"
         data-anchors="{{锚点A}}:cx,cy,r">
    <p class="t-body" style="left:120px; top:820px;">No.01</p>
    <p class="t-h1" style="left:120px; top:880px;">{{名称}}</p>
  </section>

  <!-- 转场页：data-st-from = 上一页 data-guide，data-st-to = 本页 data-guide -->
  <section data-st="zoom-match" data-st-from="{{锚点A}}" data-st-to="{{锚点B}}" data-guide="{{锚点B}}" data-hold="2">
    <img class="st-photo" src="photos/photo-02.png" width="1536" height="1024"
         data-anchors="{{锚点B}}:cx,cy,r">
    <p class="t-body" style="left:120px; top:820px;">No.02</p>
    <p class="t-h1" style="left:120px; top:880px;">{{名称}}</p>
  </section>

</div>
</div>
<script src="{{ROOT}}/node_modules/reveal.js/dist/reveal.js"></script>
<script src="{{ROOT}}/node_modules/gsap/dist/gsap.min.js"></script>
<script src="{{ROOT}}/runtime/engine.js"></script>
</body>
</html>
